name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true
