<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>מלך המגרש — טורניר ארוחת שישי</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--mut:#666;--line:#111;--soft:#bbb;--pur:#652d92}
html,body{font-family:'Heebo',system-ui,Arial,sans-serif;color:var(--ink);background:#f3f0f8}
/* ---------- screen controls (hidden in print) ---------- */
.controls{max-width:880px;margin:20px auto;background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px 20px}
.controls h2{font-weight:900;color:var(--pur);font-size:20px;margin-bottom:4px}
.controls p.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--mut);font-weight:500}
.fld input{font-family:inherit;font-size:16px;padding:8px 10px;border:1px solid #ccc;border-radius:8px;width:130px}
.btn{font-family:inherit;font-size:14px;font-weight:700;padding:9px 16px;border:0;border-radius:8px;background:var(--pur);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--pur);border:1px solid var(--pur)}
.out{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#f6f2fb;border:1px solid #e6dcf3;border-radius:10px;padding:10px 12px}
.kpi .k{font-size:11px;color:var(--mut);font-weight:500}
.kpi .v{font-size:20px;font-weight:900;color:var(--pur);line-height:1.15}
.kpi .v small{font-size:12px;font-weight:500;color:var(--mut)}
.note{margin-top:12px;font-size:12.5px;color:#444;line-height:1.5;background:#fafafa;border-inline-start:3px solid var(--pur);padding:8px 12px;border-radius:0 8px 8px 0}
.names{margin-top:12px}
.names label{font-size:12px;color:var(--mut);font-weight:500}
.names textarea{width:100%;min-height:70px;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid #ccc;border-radius:8px;margin-top:4px}
.tip{max-width:880px;margin:0 auto 30px;color:var(--mut);font-size:12px;text-align:center}
/* ---------- A4 print sheet (mentormix style) ---------- */
.sheet{background:#fff;color:#0a0a0a;width:210mm;min-height:297mm;margin:20px auto;padding:15mm 16mm 11mm;box-shadow:0 2px 16px rgba(0,0,0,.12);display:flex;flex-direction:column}
.sheet .hd{text-align:center;padding-bottom:9px;border-bottom:2.5px solid #0a0a0a}
.sheet .hd img{height:50px;width:auto;object-fit:contain;display:block;margin:0 auto 12px;filter:grayscale(1) contrast(1.05)}
.sheet .hd .eyebrow{font-size:12px;font-weight:500;letter-spacing:7px;color:#9a9a9a;padding-right:7px}
.sheet .hd h1{font-size:36px;font-weight:800;letter-spacing:1px;line-height:1.05;margin-top:5px}
.sheet .hd .s{font-size:12.5px;color:#9a9a9a;font-weight:500;letter-spacing:1px;margin-top:4px}
.fmtline{font-size:12.5px;color:#3a3a3a;margin:15px 0 2px;text-align:center;font-weight:500;line-height:1.5}
.fmtline b{color:#0a0a0a;font-weight:800}
table{width:100%;border-collapse:collapse}
.sec-h{display:flex;align-items:center;gap:20px;margin:12px 0 2px}
.sec-h .ln{flex:1;height:1.5px;background:#0a0a0a}
.sec-h h2{font-size:19px;font-weight:800;letter-spacing:3px;white-space:nowrap}
.rrow{display:grid;grid-template-columns:52px 1fr auto 1fr 52px;align-items:center;padding:5px 0;border-bottom:1px solid #e4e4e4}
.rrow:last-child{border-bottom:none}
.rrow .tm{text-align:center;font-size:14px;font-weight:700;color:#3a3a3a;font-variant-numeric:tabular-nums}
.rrow .rn{text-align:center;font-size:12px;font-weight:800;color:#9a9a9a}
.rrow .tA{text-align:left;padding-left:14px}
.rrow .tB{text-align:right;padding-right:14px}
.rrow .tA,.rrow .tB{font-size:15px;font-weight:600;line-height:1.2}
.rrow .sc{text-align:center}
.rrow .field{display:inline-flex;align-items:center;justify-content:center;gap:18px;width:100px;height:32px;border:1.3px solid #c4c4c4;border-radius:16px}
.rrow .field .colon{color:#9a9a9a;font-weight:700}
.rbrk{display:flex;align-items:center;gap:16px;margin:5px 0}
.rbrk .ln{flex:1;height:1px;background:#c4c4c4}
.rbrk span.txt{font-size:11.5px;font-weight:700;letter-spacing:2px;color:#3a3a3a;white-space:nowrap}
.tally td{border-bottom:1px solid #e4e4e4;height:30px;font-size:13.5px;padding:4px 10px}
.tally td.nm{font-weight:600;text-align:start;width:33%}
.tally td.pt{width:17%;text-align:center;color:#c4c4c4;font-weight:700}
.foot{margin-top:auto;padding-top:14px;border-top:1px solid #e4e4e4;text-align:center;font-size:12px;font-weight:500;letter-spacing:2.5px;color:#9a9a9a}
.foot b{color:#0a0a0a;font-weight:800}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .no-print{display:none!important}
  .sheet{margin:0;box-shadow:none;width:210mm;min-height:297mm}
}
</style></head>
<body>

<div class="controls no-print">
  <h2>מלך המגרש — מחשבון וזמנים</h2>
  <p class="sub">מיקס: כל סבב זוגות מתחלפים, ניקוד אישי, מגרש אחד. שנה מספר שחקנים והכול מתעדכן (כולל דף ההדפסה למטה). הדפס עם Ctrl/⌘‑P.</p>
  <div class="row">
    <div class="fld"><label>מספר שחקנים</label><input id="in-players" type="number" min="4" max="24" value="12"></div>
    <div class="fld"><label>דקות למשחק (עד 8)</label><input id="in-game" type="number" min="6" max="30" value="15"></div>
    <div class="fld"><label>שעת התחלה</label><input id="in-start" type="time" value="17:30"></div>
    <div class="fld"><label>סיום האפליקציה (ליישור)</label><input id="in-append" type="time" value="21:50"></div>
    <button class="btn" onclick="recompute()">חשב מחדש</button>
    <button class="btn sec" onclick="window.print()">הדפס דף A4</button>
  </div>
  <div class="out" id="kpis"></div>
  <div class="note" id="note"></div>
  <div class="names">
    <label>שמות שחקנים (שורה לכל שחקן — נכנס לדף):</label>
    <textarea id="in-names"></textarea>
  </div>
</div>
<p class="tip no-print">הדף מתחת הוא מה שיודפס (A4, שחור‑לבן). המחשבון והשמות למעלה לא מודפסים.</p>

<div class="sheet" id="sheet"></div>

<script>
const DEFAULT_NAMES=['פארן','בל','טלי לויט','טלי גרייזל','דניאל לויט','לינדה','איתי בנימיני','יניב פרידמן','אורן יפרח','טובי','מיכל','שי'];

function t2m(t){const[a,b]=t.split(':').map(Number);return a*60+b;}
function m2t(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}

// Fair one-court mixer rotation: balance games-played, vary partners & opponents.
function genRotation(N,R){
  const played=Array(N).fill(0), last=Array(N).fill(-99);
  const partner=Array.from({length:N},()=>Array(N).fill(0));
  const oppo=Array.from({length:N},()=>Array(N).fill(0));
  const rounds=[];
  for(let r=0;r<R;r++){
    const order=[...Array(N).keys()].sort((a,b)=> played[a]-played[b] || last[a]-last[b] || a-b);
    const four=order.slice(0,4);
    const [w,x,y,z]=four;
    const opts=[ [[w,x],[y,z]], [[w,y],[x,z]], [[w,z],[x,y]] ];
    let best=opts[0],bc=Infinity;
    for(const p of opts){
      const [t1,t2]=p;
      const cost = partner[t1[0]][t1[1]]*10 + partner[t2[0]][t2[1]]*10
                 + oppo[t1[0]][t2[0]]+oppo[t1[0]][t2[1]]+oppo[t1[1]][t2[0]]+oppo[t1[1]][t2[1]];
      if(cost<bc){bc=cost;best=p;}
    }
    rounds.push(best);
    best.flat().forEach(p=>{played[p]++;last[p]=r;});
    const[t1,t2]=best;
    partner[t1[0]][t1[1]]++;partner[t1[1]][t1[0]]++;
    partner[t2[0]][t2[1]]++;partner[t2[1]][t2[0]]++;
    [t1[0],t1[1]].forEach(a=>[t2[0],t2[1]].forEach(b=>{oppo[a][b]++;oppo[b][a]++;}));
  }
  return {rounds,played};
}

function recompute(){
  const N=Math.max(4,Math.min(24,parseInt(document.getElementById('in-players').value)||12));
  const gameMin=Math.max(6,parseInt(document.getElementById('in-game').value)||15);
  const start=document.getElementById('in-start').value||'17:00';
  const appEnd=document.getElementById('in-append').value||'22:40';
  // names textarea
  const ta=document.getElementById('in-names');
  let names=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(names.length<N){ const base=(names.length?names:DEFAULT_NAMES.slice()); while(names.length<N) names.push('שחקן '+(names.length+1)); }
  names=names.slice(0,N);
  ta.value=names.join('\n');

  const R=N-1;                        // rounds = players-1  (user's rule)
  // Friday-dinner break on ALL courts (the base court included) — shift rounds at/after it.
  const BRK_AT='20:10', BRK_MIN=20, brkAt=t2m(BRK_AT);
  const brk=(R>0 && t2m(start)<brkAt && t2m(start)+gameMin*R>brkAt)?BRK_MIN:0;
  const rt=r=>{ let t=t2m(start)+r*gameMin; if(t>=brkAt) t+=brk; return t; };
  const endM=(R>0?rt(R-1)+gameMin:t2m(start));
  const durMin=endM-t2m(start);       // court-occupancy incl. dinner break
  const {rounds,played}=genRotation(N,R);
  const perMin=Math.min(...played),perMax=Math.max(...played);

  // KPIs
  const K=[
    ['סבבים (שחקנים−1)',R,''],
    ['משך הבסיס',durMin+' דק׳', brk?('= '+gameMin+'×'+R+' + '+brk+' הפסקה'):('= '+gameMin+'×'+R)],
    ['שעת סיום בסיס',m2t(endM),'התחלה '+start],
    ['משחקים לשחקן',perMin===perMax?perMin:perMin+'–'+perMax,''],
    ['מגרש מתפנה לאפליקציה',m2t(endM),'ואז 4 מגרשים'],
  ];
  document.getElementById('kpis').innerHTML=K.map(k=>`<div class="kpi"><div class="k">${k[0]}</div><div class="v">${k[1]} <small>${k[2]}</small></div></div>`).join('');

  // alignment note
  const appM=t2m(appEnd), slack=appM-endM;
  const roundsToFill=Math.max(0,Math.round((appM-t2m(start))/gameMin));
  document.getElementById('note').innerHTML=
    `הבסיס נגמר <b>${m2t(endM)}</b> — ${slack>=0?`<b>${slack} דק׳ לפני</b> סיום האפליקציה (${appEnd}). המגרש הרביעי מתפנה לנוק‑אאוט.`:`<b>${-slack} דק׳ אחרי</b> סיום האפליקציה — שקול פחות שחקנים/סבבים.`}`+
    ` כדי למלא בדיוק עד ${appEnd} צריך ~<b>${roundsToFill}</b> סבבים (כרגע ${R}). אפשר להוסיף/להוריד סבבים ידנית.`;

  renderSheet({N,names,rounds,gameMin,start,R,durMin,endM,rt,brkAt,brk,brkNote:'ארוחת שישי'});
}

function renderSheet({N,names,rounds,gameMin,start,R,durMin,endM,rt,brkAt,brk,brkNote}){
  const nm=i=>names[i]||('שחקן '+(i+1));
  let brkShown=false;
  const rrows=rounds.map((g,r)=>{
    const [t1,t2]=g;
    const time=m2t(rt?rt(r):t2m(start)+r*gameMin);
    let pre='';
    if(brk && !brkShown && rt(r)>=brkAt && r>0 && rt(r-1)<brkAt){ brkShown=true;
      pre=`<div class="rbrk"><span class="ln"></span><span class="txt">🍽 ${brkNote||'הפסקה'} · ${m2t(brkAt)}–${m2t(brkAt+brk)}</span><span class="ln"></span></div>`; }
    return pre+`<div class="rrow">`+
      `<div class="tm">${time}</div>`+
      `<div class="tA">${nm(t1[0])} · ${nm(t1[1])}</div>`+
      `<div class="sc"><span class="field"><span></span><span class="colon">:</span><span></span></span></div>`+
      `<div class="tB">${nm(t2[0])} · ${nm(t2[1])}</div>`+
      `<div class="rn">#${r+1}</div></div>`;
  }).join('');

  // tally: 2-column grid of player + total box
  const half=Math.ceil(N/2);
  const trs=[];
  for(let i=0;i<half;i++){
    const a=i, b=i+half;
    trs.push(`<tr><td class="nm">${nm(a)}</td><td class="pt">＿＿</td>`+
      (b<N?`<td class="nm">${nm(b)}</td><td class="pt">＿＿</td>`:`<td></td><td></td>`)+`</tr>`);
  }

  document.getElementById('sheet').innerHTML=`
    <div class="hd">
      <img src="assets/volleylab-logo.png" alt="VolleyLab"/>
      <div class="eyebrow">קטגוריית בסיס</div>
      <h1>מלך המגרש</h1>
      <div class="s">טורניר ארוחת שישי · ${N} שחקנים · ${R} סבבים · ${start}–${m2t(endM)}</div>
    </div>
    <div class="fmtline">מיקס — כל סבב זוגות מתחלפים · משחק <b>עד 8</b> · ניקוד <b>אישי</b> (כל שחקן צובר את נקודות הקבוצה שלו)</div>
    <div class="sec-h"><span class="ln"></span><h2>סבבים</h2><span class="ln"></span></div>
    <div class="rot-rows">${rrows}</div>
    <div class="sec-h"><span class="ln"></span><h2>ניקוד אישי</h2><span class="ln"></span></div>
    <table class="tally"><tbody>${trs.join('')}</tbody></table>
    <div class="foot">מנוהל ידנית ליד מגרשי האפליקציה · המגרש מתפנה ב-<b>${m2t(endM)}</b> לטובת הנוק-אאוט</div>`;
}

document.getElementById('in-names').value=DEFAULT_NAMES.join('\n');
recompute();
</script>
</body></html>
