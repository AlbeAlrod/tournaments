<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>בראקט נוק-אאוט</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0a0a0a;--sec:#3a3a3a;--mut:#9a9a9a;--hair:#d7d7d7;--g:40px}
html,body{font-family:"Heebo","Assistant","Arial Hebrew",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{background:#e7e7e7}
.toolbar{width:297mm;margin:12px auto;padding:9px 14px;background:#fff;border:1px solid #ddd;border-radius:10px;display:flex;gap:10px;align-items:center}
.toolbar b{color:#652d92} .toolbar .muted{color:#8a8a8a;font-size:12px}
.toolbar button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 15px;border:0;border-radius:8px;background:#652d92;color:#fff;cursor:pointer}

.page{width:297mm;min-height:210mm;background:#fff;margin:10mm auto;padding:8mm 12mm 6mm;display:flex;flex-direction:column}
.head{text-align:center;padding-bottom:8px;border-bottom:2.5px solid var(--ink)}
.head img{height:38px;width:auto;object-fit:contain;display:block;margin:0 auto 6px;filter:grayscale(1) contrast(1.05)}
.head .eyebrow{font-size:10.5px;font-weight:500;letter-spacing:7px;color:var(--mut);padding-right:7px}
.head .title{font-size:24px;font-weight:800;letter-spacing:2px;margin-top:1px}

.bracket{display:flex;column-gap:var(--g);height:145mm;margin-top:10px}
.round{flex:1;display:flex;flex-direction:column;min-width:0}
.rhd{flex:0 0 auto;text-align:center;height:26px}
.rhd b{font-size:13.5px;font-weight:800;letter-spacing:3px}
.matches{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.unit{flex:1;display:flex;align-items:center;min-height:0}

.box{width:100%;border:1.4px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
.bh{font-size:9.5px;font-weight:700;letter-spacing:.4px;color:var(--sec);text-align:center;padding:3px 4px 2px;border-bottom:1px solid var(--hair)}
.brow{display:grid;grid-template-columns:1fr 36px;min-height:26px}
.brow + .brow{border-top:1px solid var(--hair)}
.nm{display:flex;align-items:center;padding:5px 10px;min-height:26px}
.nm .hint{font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.sc{border-right:1px solid var(--hair)}

.final .matches{display:flex;flex-direction:column;justify-content:center;gap:16px}
.final .unit{flex:0 0 auto;display:block}
.final .box{border-width:2px}
.third-unit .cap{text-align:center;font-size:9px;font-weight:600;letter-spacing:1px;color:var(--mut);margin-top:5px}

.note{margin-top:8px;padding-top:7px;border-top:1px solid var(--hair);text-align:center;font-size:11px;font-weight:500;letter-spacing:2.5px;color:var(--mut)}
.note b{color:var(--ink);font-weight:800}

@page{size:A4 landscape;margin:0}
@media print{ body{background:#fff} .toolbar{display:none!important} .page{margin:0} }
</style></head>
<body>
<div class="toolbar"><b>בראקט נוק-אאוט</b> <span id="stat" class="muted">טוען…</span>
  <button onclick="window.print()">הדפס / שמור PDF</button>
  <span class="muted">A4 לרוחב · דף לכל קטגוריה</span>
</div>
<div id="pages"></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA-rPlg0Oau16QcTjD20hDfkyveRSrD8I0",authDomain:"tournaments-33619.firebaseapp.com",projectId:"tournaments-33619",storageBucket:"tournaments-33619.firebasestorage.app",messagingSenderId:"409384565600",appId:"1:409384565600:web:61bd55676343d6035abc05"};
const db=getFirestore(getApps().length?getApps()[0]:initializeApp(cfg));
const tId=new URLSearchParams(location.search).get('t');
const koFromFB=obj=>!obj?[]:Object.keys(obj).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))).map(k=>obj[k]);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function lbl(x){ if(!x) return ''; let m;
  if(m=String(x).match(/^([A-D])(\d+)$/)){ const p=m[1],r=+m[2]; return r===1?`מנצח/ת · בית ${p}`:`מקום ${r} · בית ${p}`; }
  if(m=String(x).match(/^([A-D]\d+)\s*\/\s*([A-D]\d+)$/)){ return `מנצח/ת ${m[1]}·${m[2]}`; }
  x=String(x).replace(/Winner of Semifinals?\s*(\d)/i,'מנצח/ת חצי-גמר $1').replace(/Winner of Final/i,'מנצח/ת')
             .replace(/Loser of (?:SF|Semifinals?)\s*(\d)/i,'מפסיד/ת חצי-גמר $1');
  return x;
}
const bh=g=>(g&&Number.isFinite(g.court)&&g.time)?`מגרש ${g.court} · ${g.time}`:'&nbsp;';
const box=(g,extra='')=>`<div class="box${extra}"><div class="bh">${bh(g)}</div>`+
  `<div class="brow"><div class="nm"><span class="hint">${esc(lbl(g.a))}</span></div><div class="sc"></div></div>`+
  `<div class="brow"><div class="nm"><span class="hint">${esc(lbl(g.b))}</span></div><div class="sc"></div></div></div>`;

(async()=>{
 try{
  if(!tId){document.getElementById('stat').textContent='חסר מזהה טורניר בכתובת (?t=…)';return;}
  const snap=await getDoc(doc(db,'tournaments',tId));
  if(!snap.exists()){document.getElementById('stat').textContent='לא נמצא: '+tId;return;}
  const d=snap.data(), meta=d.meta||{}, tName=meta.name||tId;
  const wrap=document.getElementById('pages'); wrap.innerHTML=''; let made=0;
  (d.categories||[]).forEach(cat=>{
    const cs=(d.state||{})[cat.id]||{};
    const ko=koFromFB(cs.ko);
    if(!ko.length) return;
    const third=(cs.sched||[]).find(g=>g.isThirdPlace||g.gi===-1);
    const L=ko.length;
    const rname=fe=>fe===0?'גמר':fe===1?'חצי גמר':fe===2?'רבע גמר':fe===3?'שמינית גמר':'סבב';
    let roundsHtml='';
    ko.forEach((round,ri)=>{
      const fe=L-1-ri, isFinal=fe===0;
      const units=(round||[]).filter(g=>g&&!g.isBye).map(g=>`<div class="unit">${box(g, isFinal?' ':'')}</div>`).join('');
      let extra='';
      if(isFinal && third) extra=`<div class="unit third-unit">${box(third)}<div class="cap">משחק מקום 3–4</div></div>`;
      roundsHtml+=`<div class="round${isFinal?' final':''}"><div class="rhd"><b>${rname(fe)}</b></div><div class="matches">${units}${extra}</div></div>`;
    });
    const sec=document.createElement('section'); sec.className='page';
    sec.innerHTML=`<div class="head"><img src="${esc(meta.logoUrl||'assets/volleylab-logo.png')}" alt=""/>`+
      `<div class="eyebrow">${esc(tName)}</div><div class="title">${esc(cat.name||cat.id)} · נוק-אאוט</div></div>`+
      `<div class="bracket">${roundsHtml}</div>`+
      `<div class="note">מנצח/ת רבע-גמר עולה לחצי · מפסידי החצי משחקים על מקום <b>3</b></div>`;
    wrap.appendChild(sec); made++;
  });
  document.getElementById('stat').textContent=`${tName} · ${made} קטגוריות`;
  document.title=`בראקט — ${tName}`;
  window.__READY__=true;
 }catch(e){document.getElementById('stat').textContent='שגיאה: '+e.message;console.error(e);}
})();
</script>
</body></html>
